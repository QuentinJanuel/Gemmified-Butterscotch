name: Build the plugin
description: Installs the toolchains, then builds and packages the plugin. Optionally checks it first.

inputs:
  checks:
    description: Run the type check, format check, lint and tests before building.
    default: "false"
  version:
    description: Build as this version. The package.json change is not committed.
    default: ""

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash

    - name: Set the version
      if: inputs.version != ''
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: npm pkg set version="$VERSION"

    # The web build is upstream's: Emscripten (emcmake + cmake), with the version pinned.
    - uses: mymindstorm/setup-emsdk@v14
      with:
        version: 7.0.0
        actions-cache-folder: emsdk-cache

    - if: inputs.checks == 'true'
      shell: bash
      run: |
        pnpm run typecheck
        pnpm run format:check
        pnpm run lint
        pnpm run test

    # build: the runner into dist/; build:host: host.js and plugin.json into host/dist/; package: the
    # plugin directory, in plugin/.
    - shell: bash
      run: |
        pnpm run build
        pnpm run build:host
        pnpm run package
